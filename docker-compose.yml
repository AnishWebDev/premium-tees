services:
  db:
    image: postgres:16-alpine
    container_name: premium-tees-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: premium_tees
    ports:
      - "5432:5432"
    volumes:
      - premium_tees_pg:/var/lib/postgresql/data

volumes:
  premium_tees_pg:
